apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Djainesh/rollouts-practice.git
    targetRevision: main
    path: canary
  destination:
    server: https://kubernetes.default.svc
    namespace: canary-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
