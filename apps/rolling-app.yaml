apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-rolling
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Djainesh/rollouts-practice.git
    targetRevision: main
    path: rolling
  destination:
    server: https://kubernetes.default.svc
    namespace: rolling-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
