apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-rolling
spec:
  replicas: 4
  selector:
    matchLabels: {app: demo-rolling}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels: {app: demo-rolling}
    spec:
      containers:
      - name: demo
        image: argoproj/rollouts-demo:blue
        ports:
        - containerPort: 8080
