apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-rolling
spec:
  replicas: 4
  selector:
    matchLabels: { app: demo-rolling }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: { app: demo-rolling }
    spec:
      containers:
        - name: demo
          image: argoproj/rollouts-demo:yellow
          ports:
            - containerPort: 8080
